name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Needed for the deploy-pages action to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer build win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Astro 7 requires Node >=22.12; the runner defaults to Node 20.
          node-version: 22
        env:
          # Tells astro.config.mjs to build for the project subpath
          # (rugupta2024.github.io/aimplify-website) instead of the root domain.
          GITHUB_PAGES: "true"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
